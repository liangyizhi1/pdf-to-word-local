[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf-to-word-local"
version = "0.1.0"
description = "Private, offline PDF to Word conversion with a desktop interface and quality report."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "PDF to Word Local contributors" }]
keywords = ["pdf", "docx", "word", "offline", "conversion"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Office/Business",
  "Topic :: Text Processing",
]
dependencies = []

[project.optional-dependencies]
portable = ["pdf2docx>=0.5.8,<0.6", "PyMuPDF>=1.23,<2"]
dev = ["ruff>=0.8,<1", "pdf2docx>=0.5.8,<0.6", "PyMuPDF>=1.23,<2"]

[project.scripts]
pdf2word = "pdf2word_local.cli:main"
pdf2word-gui = "pdf2word_local.gui:main"

[project.urls]
Homepage = "https://github.com/liangyizhi1/pdf-to-word-local"
Issues = "https://github.com/liangyizhi1/pdf-to-word-local/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
